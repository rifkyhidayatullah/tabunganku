<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabunganku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--card:#fffdf8;--ink:#22332a;--mut:#78867c;--g1:#2f5d46;--g2:#e2eee4;--beige:#f0e7d4;--line:#ebe3d2;--inc:#2f7d52;--exp:#c4574b;--incb:#e2f0e6;--expb:#f8e6e2;--btn:#2f5d46;--btnt:#fff;--sh:0 1px 2px rgba(70,55,30,.05),0 4px 14px rgba(70,55,30,.04)}
[data-theme=dark]{--bg:#141d18;--card:#1d2a22;--ink:#edf2ea;--mut:#98a79d;--g1:#8fcf9f;--g2:#273a2e;--beige:#2b382f;--line:#2c3b32;--inc:#7fd29a;--exp:#f08a7d;--incb:#21392a;--expb:#3b2724;--btn:#8fcf9f;--btnt:#12201a}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;letter-spacing:-.02em}h2{font-size:1.5rem;margin-bottom:16px}h3{font-size:1.05rem}
small{color:var(--mut)}
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;color:var(--g1);margin:0 8px 16px}
.logo svg{width:26px;height:26px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:12px;text-align:left;font-weight:600;color:var(--mut);transition:.15s}
.nv:hover{background:var(--beige);color:var(--ink)}.nv.on{background:var(--g2);color:var(--g1)}
.nv svg{width:19px;height:19px}
.main{flex:1;min-width:0;padding:28px 32px 40px;max-width:1080px;margin:0 auto}
.ps{display:flex;gap:6px;margin:0 0 12px}.ps select{flex:1}
.top{display:none}
.bnav{display:none}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:16px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hero{background:var(--g1);color:#fff;border-radius:22px;padding:24px;margin-bottom:16px;position:relative;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
[data-theme=dark] .hero{background:#2d4a39}
.hero small{color:rgba(255,255,255,.75)}.hero h1{font-size:2.3rem;margin:4px 0;font-weight:800}
.hs{display:flex;gap:28px;width:100%;border-top:1px solid rgba(255,255,255,.2);padding-top:14px}.hs span{display:flex;flex-direction:column;font-size:.8rem;color:rgba(255,255,255,.75)}.hs b{color:#fff;font-size:1.05rem}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.85rem;transition:.15s}
.qa button:hover{transform:translateY(-2px);border-color:var(--g1)}.qa button.e svg{color:var(--exp)}.qa button.i svg{color:var(--inc)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--beige);border-radius:16px;padding:14px}.st small{display:block}.st b{font-size:1.15rem}
.two{display:grid;grid-template-columns:3fr 2fr;gap:16px}.cv{position:relative;height:260px}
.btn{background:var(--btn);color:var(--btnt);border:0;border-radius:12px;padding:10px 18px;font-weight:700;transition:.15s}
.btn:hover{opacity:.9;transform:translateY(-1px)}.btn.sec{background:var(--beige);color:var(--ink)}.btn.dng{background:var(--exp);color:#fff}.btn.wide{width:100%;margin-top:10px}
.ib{border:0;background:var(--beige);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;transition:.15s}.ib:hover{background:var(--g2)}.ib svg{width:17px;height:17px}.ib.light{background:rgba(255,255,255,.18);color:#fff}
.lk{background:none;border:0;color:var(--g1);font-weight:700}
.seg{display:flex;background:var(--beige);border-radius:11px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:.85rem}.seg button.on{background:var(--card);box-shadow:var(--sh)}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:5px;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--g1)}
.row{display:flex;gap:8px;align-items:flex-end}.row .ib{margin-bottom:0;height:43px;width:46px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.txl{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.ti svg{width:18px;height:18px}
.ti.income{background:var(--incb);color:var(--inc)}.ti.expense{background:var(--expb);color:var(--exp)}
.tm{flex:1;min-width:0}.tm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tm small{display:block}.nt{font-style:italic}
.ta{font-weight:800;white-space:nowrap}.ta.income{color:var(--inc)}.ta.expense{color:var(--exp)}
.tb{display:flex;gap:4px}
.empty{text-align:center;padding:34px 10px;color:var(--mut)}.empty svg{width:40px;height:40px;color:var(--g1);opacity:.6}.empty b{display:block;color:var(--ink);margin:8px 0 2px}.empty.sm{padding:90px 10px}
.filt{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:8px}.filt input,.filt select{margin:0}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:6px}
.bar{height:14px;background:var(--beige);border-radius:99px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:var(--g1);border-radius:99px;transition:width .6s}
.big{font-size:2.6rem;font-weight:800;color:var(--g1)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal>b{text-align:center;font-size:.78rem;color:var(--mut)}
.day{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.15s}
.day:hover{border-color:var(--g1)}.day.sel{background:var(--g1);color:var(--btnt)}.day.tdy{border:2px solid var(--g1)}.day span{display:flex;gap:3px;height:6px}
.day u{width:6px;height:6px;border-radius:9px}.day u.inc{background:var(--inc)}.day u.exp{background:var(--exp)}
.calc{max-width:340px;margin:0 auto}.cd{background:var(--beige);border-radius:16px;padding:14px 16px;text-align:right;min-height:84px;margin-bottom:10px;word-break:break-all}
.ce{display:block;font-size:1.5rem;font-weight:700;color:var(--ink)}.cr{color:var(--g1);font-weight:700}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{border:0;background:var(--card);border:1px solid var(--line);border-radius:14px;height:52px;font-size:1.15rem;font-weight:700;transition:.1s}.k:active{transform:scale(.94)}.k.op{background:var(--g2);color:var(--g1)}.k.clr{color:var(--exp)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:4px;background:var(--beige);border-radius:99px;padding:4px 4px 4px 12px;font-weight:600;font-size:.85rem}.chip .ib{width:26px;height:26px;border-radius:99px;background:transparent}.chip .ib svg{width:13px;height:13px}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li b{flex:1}
.ov{position:fixed;inset:0;background:rgba(20,30,24,.45);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:.2s;z-index:50;overflow:auto}.ov.on{opacity:1}
.md{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:440px;transform:translateY(16px) scale(.97);transition:.2s;max-height:94vh;overflow:auto}.ov.on .md{transform:none}.md h3{margin-bottom:14px}
#toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--g1);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:var(--sh);animation:ti .25s;transition:.35s}.toast.err{background:var(--exp)}.toast.out{opacity:0;transform:translateX(20px)}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}}
.ob{max-width:440px;margin:6vh auto;padding:0 16px}.ob h1{color:var(--g1);margin-bottom:4px}
:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:820px){
.side{display:none}.main{padding:14px 14px 96px}.top{display:block}
.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);overflow-x:auto;z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav .nv{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 10px;min-width:70px;align-items:center}
.grid4,.qa{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.filt{grid-template-columns:1fr 1fr}.filt input:first-child{grid-column:1/-1}
.hero h1{font-size:1.9rem}.tb{flex-direction:column}.tx{gap:8px}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script>
/* ============ KONFIGURASI FIREBASE (opsional) ============
   Isi objek di bawah dari Firebase Console > Project settings > Web app.
   Biarkan null untuk memakai penyimpanan LOKAL saja (localStorage, tidak sinkron antarperangkat). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyArGRg1IIj8T9bBHQEQw-zpvwTJk064zqU",
  authDomain: "tabunganku-56e34.firebaseapp.com",
  projectId: "tabunganku-56e34",
  storageBucket: "tabunganku-56e34.firebasestorage.app",
  messagingSenderId: "975067038536",
  appId: "1:975067038536:web:1928945e8382944810697d",
  measurementId: "G-K9T6DNBGYB"
};

/* ============ UTIL ============ */
const KEY='tabunganku.v1', MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const PAL=['#2f5d46','#7fb08a','#d9b98a','#c4574b','#8a7a5c','#5d8aa8','#b0a0c8','#e0a458','#6b705c','#a5a58d'];
const NAV=[['dashboard','Dashboard','layout-dashboard'],['transaksi','Transaksi','arrow-left-right'],['riwayat','Riwayat','history'],['kalender','Kalender','calendar-days'],['target','Target','target'],['laporan','Laporan','bar-chart-3'],['kalkulator','Kalkulator','calculator'],['pengaturan','Pengaturan','settings']];
const $=s=>document.querySelector(s), I=n=>`<i data-lucide="${n}"></i>`, ic=()=>window.lucide&&lucide.createIcons();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ds(new Date()), monthStr=()=>today().slice(0,7);
const fd=s=>{const[y,m,d]=s.split('-');return `${+d} ${MON[m-1]} ${y}`};
const rp=n=>new Intl.NumberFormat(S.cur==='IDR'?'id-ID':'en-US',{style:'currency',currency:S.cur,maximumFractionDigits:0}).format(n);
const mny=n=>S.hide?'••••••':rp(n);
const fmtIn=el=>{const d=el.value.replace(/\D/g,'').slice(0,13);el.value=d?(+d).toLocaleString('id-ID'):''};
const amt=id=>parseInt(($('#'+id).value||'').replace(/\D/g,''))||0;
const num=n=>n?(+n).toLocaleString('id-ID'):'';
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const short=v=>v>=1e6?+(v/1e6).toFixed(1)+'jt':v>=1e3?+(v/1e3).toFixed(1)+'rb':v;
function toast(m,t='ok'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.classList.add('out'),2400);setTimeout(()=>e.remove(),2900)}
function openModal(html){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md">${html}</div>`;o.addEventListener('mousedown',e=>{if(e.target===o)closeModal(o)});$('#modal').appendChild(o);requestAnimationFrame(()=>o.classList.add('on'));ic();return o}
function closeModal(o){o=o||$('#modal').lastElementChild;if(!o)return;o.classList.remove('on');setTimeout(()=>o.remove(),200)}
let AF;function ask(msg,fn,label='Ya, hapus'){AF=fn;openModal(`<h3>Konfirmasi</h3><p>${msg}</p><div class="acts"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn dng" onclick="closeModal();AF()">${label}</button></div>`)}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ============ STATE & PENYIMPANAN ============ */
const defCats=()=>({expense:['Makanan & Minuman','Transportasi','Belanja','Kebutuhan Pribadi','Tagihan','Hiburan','Kesehatan','Pendidikan','Kendaraan','Lainnya'],income:['Gaji','Freelance','Bonus','Hadiah','Usaha','Lainnya']});
let S={profiles:[],txs:[],cats:defCats(),active:null,hide:false,theme:'light',cur:'IDR'};
const _n=new Date();
const U={page:'dashboard',period:'month',rep:'month',f:{type:'',cat:'',from:'',to:'',q:'',sort:'desc'},cal:{y:_n.getFullYear(),m:_n.getMonth(),sel:null}};
const CH={}, cloud={db:null,ok:false};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r)Object.assign(S,r)}catch(e){}
let cloudT;
function save(){localStorage.setItem(KEY,JSON.stringify(S));if(cloud.db){clearTimeout(cloudT);cloudT=setTimeout(pushCloud,600)}}
const syncCode=()=>localStorage.getItem('tk.sync')||'';
async function initCloud(){
  if(!FIREBASE_CONFIG||!syncCode())return;
  try{
    for(const u of ['app','firestore'])await new Promise((ok,no)=>{const s=document.createElement('script');s.src=`https://www.gstatic.com/firebasejs/10.12.2/firebase-${u}-compat.js`;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    firebase.initializeApp(FIREBASE_CONFIG);cloud.db=firebase.firestore();
    const d=await cloud.db.collection('tabunganku').doc(syncCode()).get();
    if(d.exists){Object.assign(S,JSON.parse(d.data().json));localStorage.setItem(KEY,JSON.stringify(S))}else await pushCloud();
    cloud.ok=true;
  }catch(e){cloud.db=null;toast('Gagal terhubung ke Firebase. Memakai penyimpanan lokal.','err')}
}
async function pushCloud(){try{await cloud.db.collection('tabunganku').doc(syncCode()).set({json:JSON.stringify(S),at:Date.now()})}catch(e){toast('Sinkronisasi gagal','err')}}

/* ============ PERHITUNGAN (saldo selalu dihitung ulang dari transaksi) ============ */
const P=()=>S.profiles.find(p=>p.id===S.active);
const T=()=>S.txs.filter(t=>t.pid===S.active);
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amount,0);
const bal=()=>{const t=T();return P().opening+sum(t,'income')-sum(t,'expense')};
const sortTx=(a,dir='desc')=>[...a].sort((x,y)=>(dir==='desc'?-1:1)*(x.date.localeCompare(y.date)||x.id.localeCompare(y.id)));
const allCats=ty=>[...new Set(ty?S.cats[ty]:[...S.cats.expense,...S.cats.income])];

/* ============ RENDER UTAMA ============ */
const go=p=>{U.page=p;render();scrollTo(0,0)};
function profSel(){return `<div class="ps"><select onchange="S.active=this.value;save();render()">${S.profiles.map(p=>`<option value="${p.id}" ${p.id===S.active?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button class="ib" title="Profil baru" onclick="profileModal()">${I('user-plus')}</button></div>`}
function render(){
  document.documentElement.dataset.theme=S.theme;
  Object.values(CH).forEach(c=>c&&c.destroy());
  if(!S.profiles.length){$('#app').innerHTML=`<div class="ob"><h1>Selamat datang di Tabunganku</h1><p><small>Mulai dengan membuat profil tabungan pertamamu.</small></p><div class="card">${profileFields()}<button class="btn wide" onclick="saveProfile()">Simpan dan mulai</button></div></div>`;return}
  if(!P())S.active=S.profiles[0].id;
  const nav=NAV.map(([k,l,i])=>`<button class="nv ${U.page===k?'on':''}" onclick="go('${k}')">${I(i)}<span>${l}</span></button>`).join('');
  $('#app').innerHTML=`<div class="shell"><aside class="side"><div class="logo">${I('piggy-bank')}Tabunganku</div>${profSel()}${nav}</aside><main class="main"><div class="top">${profSel()}</div><div id="pg"></div></main><nav class="bnav">${nav}</nav></div>`;
  PAGES[U.page]();ic();
}

/* ============ PROFIL ============ */
function profileFields(p={}){return `<label>Nama pemilik tabungan<input id="p-name" maxlength="40" value="${esc(p.name||'')}" placeholder="Contoh: Ripki"></label>
<label>Saldo awal<input id="p-open" inputmode="numeric" oninput="fmtIn(this)" value="${p.opening!=null?num(p.opening):''}" placeholder="1.000.000"></label>
<label>Tanggal mulai pencatatan<input id="p-date" type="date" value="${p.start||today()}"></label>
<label>Target tabungan (opsional)<input id="p-target" inputmode="numeric" oninput="fmtIn(this)" value="${num(p.target)}" placeholder="10.000.000"></label>`}
function profileModal(id){const p=id?S.profiles.find(x=>x.id===id):{};openModal(`<h3>${id?'Ubah profil':'Profil baru'}</h3>${profileFields(p)}<div class="acts"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" onclick="saveProfile('${id||''}')">Simpan</button></div>`)}
function saveProfile(id){
  const name=$('#p-name').value.trim(),start=$('#p-date').value;
  if(!name)return toast('Nama wajib diisi','err');if(!start)return toast('Tanggal mulai wajib diisi','err');
  const o={name,opening:amt('p-open'),start,target:amt('p-target')};
  if(id)Object.assign(S.profiles.find(p=>p.id===id),o);else{const p={id:uid(),...o};S.profiles.push(p);S.active=p.id;U.page='dashboard'}
  save();closeModal();render();toast(id?'Profil diperbarui':'Profil dibuat');
}
function delProfile(id){const p=S.profiles.find(x=>x.id===id);ask(`Hapus profil <b>${esc(p.name)}</b> beserta seluruh transaksinya? Tindakan ini tidak bisa dibatalkan.`,()=>{S.profiles=S.profiles.filter(x=>x.id!==id);S.txs=S.txs.filter(t=>t.pid!==id);if(S.active===id)S.active=S.profiles[0]?.id||null;save();render();toast('Profil dihapus')})}

/* ============ TRANSAKSI ============ */
function txForm(type,id,pre){
  const t=id?S.txs.find(x=>x.id===id):{};type=t.type||type;const ex=type==='expense';
  const cats=[...S.cats[type]];if(t.cat&&!cats.includes(t.cat))cats.push(t.cat);
  openModal(`<h3>${id?'Edit':'Tambah'} ${ex?'pengeluaran':'pemasukan'}</h3>
  <label>Keterangan<input id="t-name" maxlength="80" value="${esc(t.name||'')}" placeholder="${ex?'Membeli makanan':'Gaji bulanan'}"></label>
  <label>Nominal<div class="row"><input id="t-amt" inputmode="numeric" oninput="fmtIn(this)" value="${num(t.amount||pre)}" placeholder="30.000"><button class="ib" type="button" title="Kalkulator" onclick="calcModal()">${I('calculator')}</button></div></label>
  <label>Tanggal<input id="t-date" type="date" value="${t.date||today()}"></label>
  <label>Kategori<select id="t-cat">${cats.map(c=>`<option ${c===t.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
  ${ex?`<label>Metode pembelian<select id="t-met">${['Offline','Online'].map(m=>`<option ${m===t.method?'selected':''}>${m}</option>`).join('')}</select></label>`:''}
  <label>Catatan (opsional)<textarea id="t-note" rows="2">${esc(t.note||'')}</textarea></label>
  <div class="acts"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" onclick="saveTx('${type}','${id||''}')">Simpan</button></div>`);
}
function saveTx(type,id){
  const name=$('#t-name').value.trim(),a=amt('t-amt'),date=$('#t-date').value,cat=$('#t-cat').value;
  if(!name)return toast('Keterangan wajib diisi','err');if(a<=0)return toast('Nominal harus lebih dari 0','err');
  if(!date)return toast('Tanggal wajib diisi','err');if(!cat)return toast('Pilih kategori','err');

/* ============ KALKULATOR ============ */
let CE='';const CK=['C','⌫','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0','00','.','='];
const calcHTML=mode=>`<div class="calc"><div class="cd"><span class="ce">${CE.replace(/\*/g,'×').replace(/\//g,'÷')||'0'}</span><span class="cr"></span></div><div class="keys">${CK.map(k=>`<button class="k ${/[\/*\-+=]/.test(k)?'op':''} ${k==='C'?'clr':''}" onclick="ck('${k}')">${k==='*'?'×':k==='/'?'÷':k}</button>`).join('')}</div><button class="btn wide" onclick="useCalc('${mode}')">Gunakan Hasil</button></div>`;
function calcEval(e){if(!e||!/^[\d.+\-*/%() ]+$/.test(e))return null;try{const v=Function('return ('+e.replace(/(\d+\.?\d*)%/g,'($1/100)')+')')();return isFinite(v)?Math.round(v*100)/100:null}catch(_){return null}}
function ck(k){
  if(k==='C')CE='';else if(k==='⌫')CE=CE.slice(0,-1);
  else if(k==='='){const v=calcEval(CE);if(v!=null)CE=String(v)}
  else{if(/[+\-*/]/.test(k)&&/[+\-*/]$/.test(CE))CE=CE.slice(0,-1);CE+=k}
  const v=calcEval(CE);
  document.querySelectorAll('.ce').forEach(e=>e.textContent=CE.replace(/\*/g,'×').replace(/\//g,'÷')||'0');
  document.querySelectorAll('.cr').forEach(e=>e.textContent=v==null||!/[+\-*/%]/.test(CE)?'':'= '+v.toLocaleString('id-ID'));
}
function calcModal(){openModal('<h3>Kalkulator</h3>'+calcHTML('modal'))}
function useCalc(mode){
  const v=calcEval(CE);if(v==null||v<=0)return toast('Hasil harus berupa angka lebih dari 0','err');
  const r=Math.round(v);
  if(mode==='modal'){closeModal();const f=$('#t-amt');f.value=r.toLocaleString('id-ID');toast('Hasil dimasukkan ke nominal');return}
  openModal(`<h3>Gunakan ${rp(r)} untuk…</h3><div class="acts" style="justify-content:stretch"><button class="btn dng" style="flex:1" onclick="closeModal();txForm('expense','',${r})">Pengeluaran</button><button class="btn" style="flex:1" onclick="closeModal();txForm('income','',${r})">Pemasukan</button></div>`);
}

function periodData(per){
  const n=new Date();let keys=[],labels=[],match=(d,k)=>d===k;
  if(per==='week')for(let i=6;i>=0;i--){const d=new Date(n);d.setDate(d.getDate()-i);keys.push(ds(d));labels.push(d.getDate()+' '+MON[d.getMonth()])}
  else if(per==='month'){const c=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();for(let i=1;i<=c;i++){keys.push(monthStr()+'-'+String(i).padStart(2,'0'));labels.push(i)}}
  else{for(let i=0;i<12;i++){keys.push(n.getFullYear()+'-'+String(i+1).padStart(2,'0'));labels.push(MON[i])}match=(d,k)=>d.startsWith(k)}
  return{keys,labels,match};
}

  const by={};t.filter(x=>x.type==='expense'&&inP(x)).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);const ks=Object.keys(by);
  if(!ks.length)$('#c2').parentNode.innerHTML='<div class="empty sm">Belum ada pengeluaran pada periode ini</div>';
  else CH.b=new Chart($('#c2'),{type:'doughnut',data:{labels:ks,datasets:[{data:ks.map(k=>by[k]),backgroundColor:ks.map((_,i)=>PAL[i%PAL.length]),borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.label+': '+rp(c.parsed)}}}}});

function importFile(el){
  const file=el.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.profiles)||!Array.isArray(d.txs))throw 0;IMP=d;
    openModal(`<h3>Restore backup</h3><p>Berkas berisi ${d.profiles.length} profil dan ${d.txs.length} transaksi. Salinan data saat ini disimpan otomatis sebelum restore.</p><div class="acts" style="flex-wrap:wrap"><button class="btn sec" onclick="doImport(false)">Gabungkan dengan data sekarang</button><button class="btn" onclick="doImport(true)">Ganti semua data</button></div>`)}
    catch(e){toast('Berkas backup tidak valid','err')}el.value=''};
  r.readAsText(file);
}
function doImport(replace){
  localStorage.setItem('tk.prev',JSON.stringify(S));
  if(replace){S=Object.assign({profiles:[],txs:[],cats:defCats(),active:null,hide:false,theme:'light',cur:'IDR'},IMP)}
  else{const pid=new Set(S.profiles.map(p=>p.id)),tid=new Set(S.txs.map(t=>t.id));
    IMP.profiles.forEach(p=>{if(!pid.has(p.id))S.profiles.push(p)});IMP.txs.forEach(t=>{if(!tid.has(t.id))S.txs.push(t)});
    ['expense','income'].forEach(ty=>(IMP.cats?.[ty]||[]).forEach(c=>{if(!S.cats[ty].includes(c))S.cats[ty].push(c)}))}
  if(!S.profiles.find(p=>p.id===S.active))S.active=S.profiles[0]?.id||null;
  save();closeModal();render();toast('Data berhasil dipulihkan');
}

/* ============ MULAI ============ */
render();
initCloud().then(()=>{if(cloud.ok)render()});
